name: Conditional Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # ogni ora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup files and force sync upstream
        id: sync
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Autenticazione push con token GitHub Actions
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Aggiungi upstream se non esiste
          git remote get-url upstream || git remote add upstream https://github.com/UrloMythus/MammaMia.git

          # Scarica aggiornamenti upstream
          git fetch upstream

          # Controlla differenze
          if git diff --quiet HEAD upstream/main; then
            echo "Repository already up to date"
            echo "no_change=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changes detected, syncing repository"

          backup_dir=".git/backup_files"

          mkdir -p "$backup_dir/.github/workflows"
          mkdir -p "$backup_dir/Dockerfiles"

          # Backup file personalizzati
          [ -f config.json ] && cp config.json "$backup_dir/config.json"
          [ -f update_domains.py ] && cp update_domains.py "$backup_dir/update_domains.py"
          [ -f Dockerfile ] && cp Dockerfile "$backup_dir/Dockerfile"

          # Backup workflows
          if [ -d .github/workflows ]; then
            cp -r .github/workflows/* "$backup_dir/.github/workflows/" || true
          fi

          # Backup Dockerfiles
          if [ -d Dockerfiles ]; then
            cp -r Dockerfiles/* "$backup_dir/Dockerfiles/" || true
          fi

          # Vai su main
          git checkout main || git checkout -b main

          # Reset completo a upstream/main
          git reset --hard upstream/main

          # Merge intelligente di config.json (mantiene nuovi provider del dev + tuoi URL e flag)
          if [ -f "$backup_dir/config.json" ] && [ -f config.json ]; then
            python3 -c '
          import json

          with open(".git/backup_files/config.json", "r", encoding="utf-8") as f:
              old_cfg = json.load(f)

          with open("config.json", "r", encoding="utf-8") as f:
              new_cfg = json.load(f)

          KEEP_KEYS = {
              "url", "enabled", "proxy", "ForwardProxy",
              "CB_PROXY", "CB_ForwardProxy", "MX_PROXY", "MX_ForwardProxy",
              "GS_PROXY", "GS_ForwardProxy",
              "SC_PROXY", "SC_ForwardProxy",
              "AW_PROXY", "AW_ForwardProxy",
              "ES_PROXY", "ES_ForwardProxy",
              "GF_PROXY", "GF_ForwardProxy",
              "GO_PROXY", "GO_ForwardProxy",
              "OST_PROXY", "OST_ForwardProxy",
              "TI_PROXY", "TI_ForwardProxy",
              "VD_PROXY", "VD_ForwardProxy",
              "GH_PROXY", "GH_ForwardProxy",
              "RT_PROXY", "RT_ForwardProxy",
              "UT_PROXY", "UT_ForwardProxy"
          }

          def merge_configs(new_node, old_node):
              if isinstance(new_node, dict) and isinstance(old_node, dict):
                  for k, v in new_node.items():
                      if k in old_node:
                          if k in KEEP_KEYS and not isinstance(v, dict):
                              new_node[k] = old_node[k]
                          elif k == "Global_Proxy" and not isinstance(v, dict):
                              new_node[k] = old_node[k]
                          else:
                              merge_configs(v, old_node[k])

          merge_configs(new_cfg, old_cfg)

          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(new_cfg, f, indent=4, ensure_ascii=False)
          '
          fi

          # Ripristina altri file personalizzati
          [ -f "$backup_dir/update_domains.py" ] && cp "$backup_dir/update_domains.py" update_domains.py
          [ -f "$backup_dir/Dockerfile" ] && cp "$backup_dir/Dockerfile" Dockerfile

          # Ripristina workflows
          mkdir -p .github/workflows
          if [ -d "$backup_dir/.github/workflows" ]; then
            cp -r "$backup_dir/.github/workflows/"* .github/workflows/ || true
          fi

          # Ripristina Dockerfiles
          mkdir -p Dockerfiles
          if [ -d "$backup_dir/Dockerfiles" ]; then
            cp -r "$backup_dir/Dockerfiles/"* Dockerfiles/ || true
          fi

          # Commit modifiche
          git add .

          git commit -m "Sync upstream and merge config.json" || echo "No changes to commit"

          # Push forzato
          git push origin main --force

          echo "no_change=false" >> $GITHUB_OUTPUT

          # Cleanup
          rm -rf "$backup_dir"

      - name: Sync completed
        if: steps.sync.outputs.no_change == 'false'
        run: echo "Repository synced successfully."
